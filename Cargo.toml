[workspace]
members = [
    "state-machines",
    "state-machines-core",
    "state-machines-macro",
    "state-machines-cli",
]
# release-please's cargo-workspace plugin bumps every member, including
# publish=false packages. Keep runnable examples/fixtures in their own workspaces.
exclude = ["examples", "tests/feature_split"]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Lints this codebase opts out of, with the reason:
# - the local runtime and the methods generated for it are !Send by design; `runtime-send` is the Send flavour
future_not_send = "allow"
# - the macro invokes every callback as `self.hook()`, so a callback that needs nothing from the machine still takes `&self`
unused_self = "allow"

# Crate docs show complete programs, including `fn main`
needless_doctest_main = "allow"
