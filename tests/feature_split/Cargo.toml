[package]
name = "feature_split"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Regression fixture: host and target link state-machines with different features"

# Keep this non-release fixture out of release-please's workspace dependency graph.
[workspace]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[dependencies]
state-machines = { path = "../../state-machines" }

[build-dependencies]
state-machines = { path = "../../state-machines", features = ["std", "serde", "runtime"] }
