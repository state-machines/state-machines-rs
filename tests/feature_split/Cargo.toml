[package]
name = "feature_split"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
publish = false
description = "Regression fixture: host and target link state-machines with different features"

# Keep this non-release fixture out of release-please's workspace dependency graph.
[workspace]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"
# Binary crates: unused `pub` items are dead code too
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Lints this codebase opts out of, with the reason:
# - the local runtime and the methods generated for it are !Send by design; `runtime-send` is the Send flavour
future_not_send = "allow"
# - the macro invokes every callback as `self.hook()`, so a callback that needs nothing from the machine still takes `&self`
unused_self = "allow"

[lints]
workspace = true

[dependencies]
state-machines = { path = "../../state-machines" }

[build-dependencies]
state-machines = { path = "../../state-machines", features = ["std", "serde", "runtime"] }
