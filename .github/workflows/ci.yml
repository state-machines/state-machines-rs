name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # Gate rustc warnings in every build/test step without RUSTFLAGS rebuilding deps
  CARGO_BUILD_WARNINGS: deny

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Run tests
        run: |
          cargo test --workspace --all-features
          cargo test --workspace --features state-machines/runtime,state-machines/serde,state-machines/async,state-machines/dynamic,state-machines/std
      - name: Test examples
        run: cargo test --manifest-path examples/Cargo.toml --workspace --all-features
      - name: Run example programs
        run: |
          for package in basic_transitions guards_and_validation callbacks_lifecycle async_patterns hierarchical_thinking dynamic_dispatch_when traffic_light; do
            cargo run --manifest-path examples/Cargo.toml --package "$package"
          done

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: rustup component add rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path examples/Cargo.toml --all -- --check
          cargo fmt --manifest-path tests/feature_split/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: rustup component add clippy
      - name: Run clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --workspace --all-targets --features state-machines/runtime,state-machines/serde,state-machines/async,state-machines/dynamic,state-machines/std -- -D warnings
          cargo clippy --manifest-path examples/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path tests/feature_split/Cargo.toml --all-targets -- -D warnings

  no-std:
    name: no_std Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build core (no_std)
        run: cargo build -p state-machines-core --no-default-features
      - name: Build macro (no_std)
        run: cargo build -p state-machines-macro --no-default-features
      - name: Build main (no_std)
        run: cargo build -p state-machines --no-default-features
      - name: Build snapshots (no_std + alloc)
        run: cargo build -p state-machines --no-default-features --features serde,dynamic
      - name: Build local runtime (no_std + alloc)
        run: cargo build -p state-machines --no-default-features --features runtime,serde,dynamic
      # Built alone: a workspace build unifies features and hides the split
      - name: Build feature-split fixture (host inspect, target without)
        run: cargo build --manifest-path tests/feature_split/Cargo.toml
      - name: Build embedded example without std
        run: cargo build --manifest-path examples/Cargo.toml -p no_std_flight

  build:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build release
        run: |
          cargo build --workspace --release
          cargo build --manifest-path examples/Cargo.toml --workspace --release
