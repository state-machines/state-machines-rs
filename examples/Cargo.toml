# Separate from the release workspace: examples are tested, never version-bumped.
[workspace]
members = [
    "no_std_flight",
    "basic_transitions",
    "guards_and_validation",
    "callbacks_lifecycle",
    "async_patterns",
    "hierarchical_thinking",
    "dynamic_dispatch_when",
    "traffic_light",
]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[workspace.dependencies]
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
# Binary crates: unused `pub` items are dead code too
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Lints this codebase opts out of, with the reason:
# - the local runtime and the methods generated for it are !Send by design; `runtime-send` is the Send flavour
future_not_send = "allow"
# - the macro invokes every callback as `self.hook()`, so a callback that needs nothing from the machine still takes `&self`
unused_self = "allow"

