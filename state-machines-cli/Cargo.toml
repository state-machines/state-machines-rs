[package]
name = "state-machines-cli"
version = "0.1.9"
edition = "2024"
rust-version.workspace = true
authors = ["Abdelkader Boudih <terminale@gmail.com>"]
description = "CLI tool for state-machines visualization and introspection"
license = "MIT"
repository = "https://github.com/state-machines/state-machines-rs"
keywords = ["state-machine", "cli", "mermaid", "visualization"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "state-machines"
path = "src/main.rs"

[dependencies]
state-machines-core = { version = "0.14.0", path = "../state-machines-core", features = ["std"] }
usage-rs = "7"

# Not `workspace = true`: Cargo forbids mixing inherited and local entries, and
# dead_code_pub_in_binary must stay off library crates (their unit-test
# harnesses are binaries, so every `pub` item would look dead).
[lints.rust]
unsafe_code = "forbid"
# Binary crate: unused `pub` items are dead code too
dead_code_pub_in_binary = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Lints this codebase opts out of, with the reason:
# - the local runtime and the methods generated for it are !Send by design; `runtime-send` is the Send flavour
future_not_send = "allow"
# - the macro invokes every callback as `self.hook()`, so a callback that needs nothing from the machine still takes `&self`
unused_self = "allow"
