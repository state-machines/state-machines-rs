[package]
name = "state-machines-cli"
version = "0.1.5"
edition = "2024"
rust-version.workspace = true
authors = ["Abdelkader Boudih <terminale@gmail.com>"]
description = "CLI tool for state-machines visualization and introspection"
license = "MIT"
repository = "https://github.com/state-machines/state-machines-rs"
keywords = ["state-machine", "cli", "mermaid", "visualization"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "state-machines"
path = "src/main.rs"

[dependencies]
state-machines-core = { version = "0.11.1", path = "../state-machines-core", features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0"

# Not `workspace = true`: Cargo forbids mixing inherited and local entries, and
# dead_code_pub_in_binary must stay off library crates (their unit-test
# harnesses are binaries, so every `pub` item would look dead).
[lints.rust]
unsafe_code = "forbid"
# Binary crate: unused `pub` items are dead code too
dead_code_pub_in_binary = "warn"
